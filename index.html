<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zákazky — prehľad výroby</title>
<meta name="robots" content="noindex, nofollow">
<style>
  :root{
    --paper:#E4E6E1; --surface:#F8F8F6; --surface-2:#EDEEEA;
    --ink:#14181A; --ink-2:#525B58; --ink-3:#8A918D;
    --line:#CBCFC8; --line-2:#DDE0DA;
    --done:#1F5E4A; --work:#B4590A;
    --head-bg:#14181A; --head-fg:#F8F8F6; --head-mut:#9BA6A1;
  }
  @media (prefers-color-scheme:dark){
    html:not([data-theme="light"]){
      --paper:#131719; --surface:#1B2023; --surface-2:#21272A;
      --ink:#E7E9E5; --ink-2:#A6AEAA; --ink-3:#79827E;
      --line:#343C3F; --line-2:#2A3134;
      --done:#67C79E; --work:#F0A044;
      --head-bg:#0C0F11; --head-fg:#E7E9E5; --head-mut:#7E8985;
    }
  }
  html[data-theme="dark"]{
    --paper:#131719; --surface:#1B2023; --surface-2:#21272A;
    --ink:#E7E9E5; --ink-2:#A6AEAA; --ink-3:#79827E;
    --line:#343C3F; --line-2:#2A3134;
    --done:#67C79E; --work:#F0A044;
    --head-bg:#0C0F11; --head-fg:#E7E9E5; --head-mut:#7E8985;
  }

  *{box-sizing:border-box}
  body{margin:0;overflow-x:hidden;background:var(--paper);color:var(--ink);
       font-family:sans-serif;-webkit-text-size-adjust:100%}

  .top{position:relative;overflow:hidden;background:var(--head-bg);
       color:var(--head-fg);padding:20px 16px 16px}
  .top::before{
    content:"";position:absolute;inset:-40px -10px auto -10px;height:120px;
    background:radial-gradient(circle at 14% 26%, rgba(255,255,255,.14) 1.6px, transparent 1.7px) 0 0/22px 19px;
    -webkit-mask-image:linear-gradient(to bottom,#000,transparent 78%);
    mask-image:linear-gradient(to bottom,#000,transparent 78%);pointer-events:none;
  }
  .top-in{position:relative;max-width:1100px;margin:0 auto}
  h1{font-family:"sans-serif-condensed",sans-serif;font-weight:700;font-size:34px;
     line-height:.95;letter-spacing:.06em;text-transform:uppercase;margin:0 0 4px}
  .sub{font-family:monospace;font-size:10.5px;letter-spacing:.13em;
       text-transform:uppercase;color:var(--head-mut);margin:0}
  .stats{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}
  .stat{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.13);
        padding:6px 10px 5px;flex:1 1 80px;min-width:0}
  .stat b{display:block;font-family:monospace;font-size:17px;font-weight:600;line-height:1}
  .stat span{display:block;font-size:9px;letter-spacing:.11em;text-transform:uppercase;
             color:var(--head-mut);margin-top:5px}
  .stat.w b{color:#F0A044}
  .stat.d b{color:#67C79E}

  .bar{background:var(--paper);border-bottom:1px solid var(--line);padding:9px 16px}
  .bar-in{max-width:1100px;margin:0 auto;display:flex;flex-wrap:wrap;gap:7px;align-items:center}
  .chips{display:flex;border:1px solid var(--line);background:var(--surface)}
  .chip{font-family:"sans-serif-condensed",sans-serif;font-weight:600;font-size:13.5px;
        letter-spacing:.06em;text-transform:uppercase;padding:8px 11px 6px;
        border:0;border-right:1px solid var(--line-2);background:transparent;
        color:var(--ink-2);cursor:pointer}
  .chip:last-child{border-right:0}
  .chip[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
  .search{flex:1 1 150px;min-width:130px}
  .search input{width:100%;font-family:monospace;font-size:13px;padding:8px 10px;
                border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:0}
  .tbtn{border:1px solid var(--line);background:var(--surface);color:var(--ink-2);
        font-size:14px;width:36px;height:34px;cursor:pointer;padding:0}
  .stamp{font-family:monospace;font-size:10px;letter-spacing:.09em;text-transform:uppercase;
         color:var(--ink-3);margin-left:auto;white-space:nowrap}

  .wrap{max-width:1100px;margin:0 auto;padding:14px 16px 60px}

  .grid{display:grid;grid-template-columns:44px minmax(110px,1.2fr) 74px repeat(3,minmax(96px,1fr)) 128px}
  .head>div{font-family:"sans-serif-condensed",sans-serif;font-weight:600;font-size:12px;
            letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);
            padding:0 8px 6px;border-bottom:2px solid var(--ink);align-self:end}
  .cell{background:var(--surface);border-bottom:1px solid var(--line-2);
        padding:8px;display:flex;align-items:center;min-height:44px;min-width:0}
  .row:nth-child(even) .cell{background:var(--surface-2)}
  .num{font-family:monospace;font-size:12px;color:var(--ink-3)}
  .ord{font-family:monospace;font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis}
  .siz{font-family:"sans-serif-condensed",sans-serif;font-weight:700;font-size:14px;letter-spacing:.04em}
  .dat{font-family:monospace;font-size:12.5px;color:var(--ink-2)}
  .dat.none{color:var(--ink-3)}
  .lab{display:none}

  .stat-cell{flex-direction:column;align-items:flex-start;gap:5px;justify-content:center}
  .track{display:flex;gap:3px}
  .seg{width:20px;height:16px;display:grid;place-items:center;
       font-family:"sans-serif-condensed",sans-serif;font-weight:700;font-size:11px;
       border:1px solid var(--line);color:var(--ink-3);background:transparent}
  .seg.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
  .seg.on.fin{background:var(--done);border-color:var(--done);color:#fff}
  .slab{font-family:monospace;font-size:9px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
  .slab.work{color:var(--work);font-weight:600}
  .slab.done{color:var(--done);font-weight:600}

  .msg{background:var(--surface);border:1px dashed var(--line);padding:34px 18px;
       text-align:center;color:var(--ink-2);font-size:14px}

  @media screen and (max-width:760px){
    .grid{display:block}
    .head{display:none}
    .row{display:grid;grid-template-columns:repeat(3,1fr);
         background:var(--surface);border:1px solid var(--line);margin-bottom:9px}
    .row:nth-child(even) .cell{background:transparent}
    .cell{background:transparent;border-bottom:1px solid var(--line-2);
          flex-direction:column;align-items:stretch;gap:2px;padding:7px 9px}
    .lab{display:block;font-family:"sans-serif-condensed",sans-serif;font-weight:600;
         font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
    .c-num{grid-column:span 1}
    .c-num .lab{display:none}
    .c-ord{grid-column:span 2}
    .c-siz{grid-column:span 3}
    .c-d{grid-column:span 1}
    .c-st{grid-column:span 3;flex-direction:row;align-items:center;gap:9px}
    h1{font-size:28px}
  }
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <h1>Zákazky</h1>
    <p class="sub">Výroba · Striekanie · Odovzdanie</p>
    <div class="stats">
      <div class="stat"><b id="s-all">–</b><span>Celkom</span></div>
      <div class="stat w"><b id="s-work">–</b><span>Rozrobené</span></div>
      <div class="stat d"><b id="s-done">–</b><span>Odovzdané</span></div>
    </div>
  </div>
</header>

<div class="bar">
  <div class="bar-in">
    <div class="search"><input id="q" type="search" placeholder="Hľadať zákazku…" aria-label="Hľadať"></div>
    <div class="chips" role="group" aria-label="Filter">
      <button class="chip" data-f="all" aria-pressed="true">Všetky</button>
      <button class="chip" data-f="work" aria-pressed="false">Rozrobené</button>
      <button class="chip" data-f="done" aria-pressed="false">Odovzdané</button>
    </div>
    <button class="tbtn" id="theme" title="Svetlý / tmavý režim">☾</button>
    <span class="stamp" id="stamp">Načítavam…</span>
  </div>
</div>

<main class="wrap">
  <div class="grid" id="grid">
    <div class="head" style="display:contents">
      <div>Č.</div><div>Zákazka</div><div>Veľ.</div>
      <div>Vyrobené</div><div>Nastriekané</div><div>Odovzdané</div><div>Stav</div>
    </div>
    <div id="rows" style="display:contents"></div>
  </div>
  <div class="msg" id="msg">Načítavam zoznam…</div>
</main>

<script>
(function(){
  var DATA = 'zakazky.json';
  var orders = [], updated = '';
  var filter = 'all', q = '';
  var theme = 'auto';

  var $ = function(id){ return document.getElementById(id); };
  var esc = function(s){
    return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];
    });
  };
  var dm = function(d){
    if (!d) return '—';
    var p = String(d).split('-');
    return p.length === 3 ? p[2] + '.' + p[1] + '.' + p[0] : String(d);
  };

  /* ---------- téma ---------- */
  function isDark(){
    if (theme === 'dark') return true;
    if (theme === 'light') return false;
    return !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  }
  function applyTheme(){
    var el = document.documentElement;
    if (theme === 'dark' || theme === 'light') el.setAttribute('data-theme', theme);
    else el.removeAttribute('data-theme');
    $('theme').textContent = isDark() ? '☀' : '☾';
  }
  $('theme').onclick = function(){ theme = isDark() ? 'light' : 'dark'; applyTheme(); };
  applyTheme();

  /* ---------- stav ---------- */
  function stage(o){
    if (o.od) return { key:'done', text:'Odovzdané', n:3 };
    if (o.st) return { key:'work', text:'Nastriekané', n:2 };
    if (o.vy) return { key:'work', text:'Vo výrobe', n:1 };
    return { key:'work', text:'Nová', n:0 };
  }

  function trackHTML(o){
    var s = stage(o);
    var keys = ['V','S','O'], on = [!!o.vy, !!o.st, !!o.od];
    var h = '<div class="track">';
    for (var i=0;i<3;i++){
      h += '<i class="seg' + (on[i] ? ' on' : '') + (on[i] && i === 2 ? ' fin' : '') +
           '" style="font-style:normal">' + keys[i] + '</i>';
    }
    return h + '</div><span class="slab ' + s.key + '">' + s.text + '</span>';
  }

  /* ---------- vykreslenie ---------- */
  function visible(){
    var out = [];
    var needle = q.trim().toLowerCase();
    for (var i=0;i<orders.length;i++){
      var o = orders[i];
      if (needle && String(o.c || '').toLowerCase().indexOf(needle) === -1) continue;
      if (filter !== 'all' && stage(o).key !== filter) continue;
      out.push({ o:o, i:i });
    }
    return out;
  }

  function render(){
    var list = visible();
    var h = '';
    for (var k=0;k<list.length;k++){
      var o = list[k].o;
      var seq = String(list[k].i + 1);
      if (seq.length < 2) seq = '0' + seq;
      h += '<div class="row">' +
        '<div class="cell c-num"><span class="num">' + seq + '</span></div>' +
        '<div class="cell c-ord"><span class="lab">Zákazka</span>' +
          '<span class="ord">' + esc(o.c || '—') + '</span></div>' +
        '<div class="cell c-siz"><span class="lab">Veľkosť</span>' +
          '<span class="siz">' + esc(o.v || '—') + '</span></div>' +
        '<div class="cell c-d"><span class="lab">Vyrobené</span>' +
          '<span class="dat' + (o.vy ? '' : ' none') + '">' + dm(o.vy) + '</span></div>' +
        '<div class="cell c-d"><span class="lab">Nastriekané</span>' +
          '<span class="dat' + (o.st ? '' : ' none') + '">' + dm(o.st) + '</span></div>' +
        '<div class="cell c-d"><span class="lab">Odovzdané</span>' +
          '<span class="dat' + (o.od ? '' : ' none') + '">' + dm(o.od) + '</span></div>' +
        '<div class="cell c-st stat-cell">' + trackHTML(o) + '</div>' +
      '</div>';
    }
    $('rows').innerHTML = h;

    var none = list.length === 0;
    $('grid').style.display = none ? 'none' : 'grid';
    $('msg').style.display = none ? 'block' : 'none';
    if (none){
      $('msg').textContent = orders.length
        ? 'Nič nesedí — skús iný filter alebo iné číslo zákazky.'
        : 'Zoznam je zatiaľ prázdny.';
    }

    var all = orders.length, work = 0, done = 0;
    for (var i=0;i<all;i++){ if (stage(orders[i]).key === 'done') done++; else work++; }
    $('s-all').textContent = all;
    $('s-work').textContent = work;
    $('s-done').textContent = done;
  }

  /* ---------- načítanie dát ---------- */
  function fetchData(quiet){
    fetch(DATA + '?t=' + Date.now(), { cache: 'no-store' })
      .then(function(r){
        if (!r.ok) throw new Error('http ' + r.status);
        return r.json();
      })
      .then(function(d){
        orders = Array.isArray(d) ? d : (d.orders || []);
        updated = d.updated || '';
        $('stamp').textContent = updated ? 'Údaje k ' + updated : 'Načítané';
        render();
      })
      .catch(function(){
        $('stamp').textContent = 'Nedostupné';
        if (!orders.length && !quiet){
          $('grid').style.display = 'none';
          $('msg').style.display = 'block';
          $('msg').textContent = 'Zoznam sa nepodarilo načítať. Skús obnoviť stránku.';
        }
      });
  }

  $('q').addEventListener('input', function(e){ q = e.target.value; render(); });
  var chips = document.querySelectorAll('.chip');
  for (var c=0;c<chips.length;c++){
    chips[c].addEventListener('click', function(e){
      filter = e.currentTarget.dataset.f;
      for (var j=0;j<chips.length;j++){
        chips[j].setAttribute('aria-pressed', chips[j] === e.currentTarget ? 'true' : 'false');
      }
      render();
    });
  }

  fetchData();
  setInterval(function(){ fetchData(true); }, 120000);
  document.addEventListener('visibilitychange', function(){
    if (document.visibilityState === 'visible') fetchData(true);
  });
})();
</script>

</body>
</html>
